name: Release

on:
  push:
    tags: ["**/v*.*.*"] # per-module tags: logger/v0.1.0, x/circuitbreaker/v0.1.0 — ** crosses the slash in nested module paths
  workflow_dispatch: # recovery path: GitHub emits no push events for >3 tags in one push
    inputs:
      tag:
        description: "Existing tag to release (e.g. cli/v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
