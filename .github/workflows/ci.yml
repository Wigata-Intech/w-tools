name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [cli, httpx, logger, x/circuitbreaker, x/hasher, x/sshx]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
      GOWORK: "off" # every module must stand alone — same proof as `make build`
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ matrix.module }}

      - name: build (CGO off)
        run: CGO_ENABLED=0 go build ./...

      - name: test (race)
        run: go test -race -cover $(go list ./... | grep -v /examples/)

      - name: bench (smoke)
        run: go test -bench=. -benchtime=1x -run='^$' $(go list ./... | grep -v /examples/)

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  examples:
    name: examples (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false # no go.sum: the workspace supplies every module locally

      - name: vet and build against workspace HEAD
        working-directory: httpx/examples
        run: go vet ./... && go build ./...

      - name: run the redaction proof
        working-directory: httpx/examples
        run: |
          out=$(go run ./redaction)
          echo "$out" | grep -q '\[REDACTED\]'

      - name: run the breaker proof
        working-directory: httpx/examples
        run: |
          out=$(go run ./breaker)
          echo "$out" | grep -q 'CIRCUIT OPEN'

      - name: run the cli env-binding proof
        working-directory: cli/examples
        run: |
          go vet ./... && go build ./...
          out=$(DEMO_GREETING=hallo go run ./demo greet World)
          echo "$out" | grep -q 'hallo, World'
          out=$(go run ./service --help)
          echo "$out" | grep -q 'migrate'
