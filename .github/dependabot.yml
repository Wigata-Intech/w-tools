version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # One gomod entry per module; x/sshx is the only one with a real dependency.
  - package-ecosystem: "gomod"
    directory: "/cli"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/cli/examples"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/httpx"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/httpx/examples"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/logger"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/x/circuitbreaker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/x/sshx"
    schedule:
      interval: "weekly"
