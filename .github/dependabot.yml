version: 2
updates:
  # Keeps GitHub Actions pinned versions fresh — the only real dependency surface this repo has.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Zero third-party deps by policy, so the gomod entries stay quiet — they exist
  # to scream if a dependency ever sneaks into a go.mod. One entry per module;
  # examples is the likeliest sneak-in point (the one module allowed to require siblings).
  - package-ecosystem: "gomod"
    directory: "/cli"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/cli/examples"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/httpx"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/httpx/examples"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/logger"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/x/circuitbreaker"
    schedule:
      interval: "weekly"
